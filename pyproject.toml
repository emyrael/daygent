[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daygent"
version = "0.2.2"
description = "Static lineage and impact analysis for modern data + AI repositories."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Emmanuel Onwubuya" }]
maintainers = [{ name = "Emmanuel Onwubuya" }]
keywords = [
    "lineage",
    "impact-analysis",
    "dbt",
    "sql",
    "fastapi",
    "langgraph",
    "llm",
    "vector-store",
    "static-analysis",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "rich>=13.7",
    "sqlglot>=25.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
release = ["build>=1.2", "twine>=5.0"]

[project.scripts]
daygent = "daygent.cli:main"

[project.urls]
Homepage = "https://github.com/emyrael/daygent"
Repository = "https://github.com/emyrael/daygent"
Issues = "https://github.com/emyrael/daygent/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"daygent.viewer" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
