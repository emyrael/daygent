[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daygent"
version = "0.1.0"
description = "Static lineage and impact analysis for modern data + AI repositories."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Daygent contributors" }]
keywords = ["lineage", "dbt", "sql", "fastapi", "langgraph", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "rich>=13.7",
    "sqlglot>=25.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
daygent = "daygent.cli:main"

[project.urls]
Homepage = "https://github.com/emyrael/daygent"
Issues = "https://github.com/emyrael/daygent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
